minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[update]
freeze = true
cooldown_days = 0

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12

[[repos.hooks]]
id = "actionlint"

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8" # frozen: v1.33.1

# Matches the pedantic audit in security.yml.
[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "4fe331a7a15503e1530cf27656fb08db83cffa34" # frozen: v0.3.6

[[repos.hooks]]
id = "rumdl-check"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "276087d9a4f06398b3e04825487805e2d7375888" # frozen: v1.52.2

[[repos.hooks]]
id = "typos"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8" # frozen: v4.5.0

# Strict mode also rejects fixup! and merge commit messages.
[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
  "--strict",
  "--verbose",
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1

# Scans the staged diff; security.yml scans the complete history.
[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "local"

# Installs the pinned `gh actions-lock` extension when it is missing.
[[repos.hooks]]
id = "actions-lock-verify"
name = "actions.lock matches workflow dependencies"
language = "system"
entry = "make actions-lock-verify"
files = "^\\.github/workflows/"
pass_filenames = false

[[repos.hooks]]
id = "forbid-submodules"
name = "forbid submodules"
language = "fail"
entry = "submodules are not allowed in this repository:"
types = ["directory"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "mixed-line-ending"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch=main"]
