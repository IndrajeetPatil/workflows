version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /.github/presentation-a11y
    schedule:
      interval: weekly
    groups:
      presentation-a11y:
        patterns:
          - "*"
