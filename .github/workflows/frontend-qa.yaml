name: frontend-qa

on:
  workflow_call:
    inputs:
      install-chromium:
        description: "Install Playwright Chromium for browser-based unit tests."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    name: Frontend QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache-toolchain: true
          cache: true
          run-install: |
            args: [--frozen-lockfile, --, --loglevel=warn]

      - name: Install Playwright Chromium (browser tests)
        if: inputs.install-chromium
        run: vp exec playwright install --with-deps chromium

      - name: File naming (ls-lint)
        run: |
          if [ -f .ls-lint.yml ] || [ -f .ls-lint.yaml ] || [ -f .ls-lint.json ]; then
            vp run file-naming
          fi

      - name: Format, lint, and types
        run: vp check --deny-warnings --continue-on-error

      - name: Types (tsc)
        run: vp exec tsc -b

      - name: CSS code quality
        run: vp run css-quality

      - name: Unit tests and coverage
        run: vp test --coverage

      - name: Fallow (dead code, duplication, complexity)
        run: vp run fallow

      - name: Type coverage
        run: |
          if node -e 'const p = JSON.parse(require("fs").readFileSync("package.json","utf8")); process.exit(p.scripts && p.scripts["type-coverage"] ? 0 : 1)'; then
            vp run type-coverage
          fi

      - name: Production build
        run: vp build --logLevel warn

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage
            test-results
          if-no-files-found: ignore
          retention-days: 14
