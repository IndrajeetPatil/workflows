on:
  workflow_call:

name: Build and Deploy Presentation

permissions:
  contents: read

jobs:
  build-presentation:
    name: Build presentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is restricted to repositories owned by IndrajeetPatil."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pandoc (latest)
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: latest

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: release

      - name: Report tool versions
        run: |
          quarto --version
          pandoc --version | head -n 1

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Install R dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # Save the package cache right after installation, even if later steps fail.
          cache: always
          upgrade: "TRUE"

      - name: Install RevealJS accessibility extension
        run: quarto add https://github.com/mcanouil/quarto-revealjs-a11y/archive/6700ffd9ed11e1475474ab47e7c61580f1f22b9f.zip --no-prompt # 0.3.0

      - name: Turn R warnings into errors
        run: |
          echo "" >> .Rprofile
          echo 'options(warn = 2)' >> .Rprofile

      - name: Install RevealJS read-aloud extension
        run: quarto add https://github.com/IndrajeetPatil/quarto-read-aloud/archive/9ae3a52273436d79b3c1c49b13c1312924eb0431.zip --no-prompt # v0.3.0

      - name: Render slides
        run: quarto render

      - name: Remove hidden paths other than .well-known
        # Resource globs can copy files from hidden folders such as .venv into
        # _site; .well-known is the only hidden path the site should publish.
        run: find _site -mindepth 1 -path _site/.well-known -prune -o -name '.*' -prune -exec rm -rf {} +

      - name: Audit accessibility with axe-core
        # Pull requests only: callers' default branches accept changes solely
        # through pull requests, so pushes deploy decks already checked here.
        # Fails on any axe-core finding in the rendered site. Reveal's vendored
        # speaker-notes page under index_files/ is not part of the deck.
        # Exit 1 means findings and fails at once; exit 2 means an incomplete
        # scan, such as headless Chrome failing to start, and is retried.
        if: github.event_name == 'pull_request'
        run: |
          for attempt in 1 2 3; do
            status=0
            quarto call axe _site --exclude 'index_files/**' --fail-on minor || status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "::warning::axe scan incomplete on attempt ${attempt} of 3"
          done
          exit 2

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy presentation
    if: github.event_name != 'pull_request'
    needs: build-presentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Required to configure and deploy GitHub Pages.
      id-token: write # Required for Pages OIDC authentication.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is restricted to repositories owned by IndrajeetPatil."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
