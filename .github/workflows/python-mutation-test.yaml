name: Python Mutation Testing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mutmut:
    name: Run mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install --color=always

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked --color=always

      - name: Run mutation tests
        run: make mutation-test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-report
          path: mutants/
          if-no-files-found: ignore
