name: Python Benchmarks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run CodSpeed benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # CodSpeed requests a short-lived OIDC upload token.
    env:
      UV_PYTHON: "3.15"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install "$UV_PYTHON"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run benchmarks and upload results
        uses: CodSpeedHQ/action@b1f28b5eccf7cb5bfe6a2a89cb3053eb67f1150c # v5.8.0
        with:
          mode: simulation
          run: make benchmark
