on:
  workflow_call:

name: check-link-rot

permissions:
  contents: read

jobs:
  check-link-rot:
    name: Check link rot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # The action defaults to '*.md', '*.html' and '*.rst' only, which
          # silently skips the slide sources themselves: presentation decks keep
          # nearly all of their outbound links in index.qmd, and the llms.txt /
          # llms-full.txt mirrors are plain text. Without these globs the check
          # reports success while never reading the files it exists to guard.
          args: >-
            --verbose --no-progress
            './**/*.md' './**/*.html' './**/*.rst'
            './**/*.qmd' './**/*.txt'
