name: Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan complete Git history
        run: gitleaks git --log-opts="--all" --no-banner --redact .

  workflow-audit:
    name: Workflow Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Color audit logs while retaining GitHub annotation output.
    env:
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs zizmor from hash-locked wheels and annotates findings inline;
      # results stay in the log rather than the code scanning tab.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows/
          persona: pedantic
          advanced-security: false
          annotations: true
