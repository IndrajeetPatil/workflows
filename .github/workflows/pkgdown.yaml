# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_call:
    inputs:
      no-suggests:
        type: boolean
        default: false
        description: 'Build with hard dependencies only (no Suggests); skips deployment'

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    name: Build pkgdown site
    if: ${{ !inputs.no-suggests || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Install dependencies (no-suggests mode)
        if: inputs.no-suggests
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          dependencies: '"hard"'
          # Isolate hard-only caches and invalidate them when DESCRIPTION changes.
          cache-version: hard-deps-1-${{ hashFiles('DESCRIPTION') }}
          extra-packages: |
            any::knitr
            any::rmarkdown
            r-lib/pkgdown
            local::.
          needs: website

      - name: Install dependencies (full mode)
        if: ${{ !inputs.no-suggests }}
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            r-lib/pkgdown
            local::.
          needs: website

      - name: Build site
        run: |
          options(crayon.enabled = TRUE)

          # pkgdown builds every page serially. Prebuild the expensive pages
          # (R Markdown articles and reference topics with examples) in parallel
          # worker processes, then let the lazy site build skip any page whose
          # output is newer than its source. A page that fails here is simply
          # rebuilt, with pkgdown's usual error reporting, by the final build.
          override <- list(destination = "docs")
          pkg <- pkgdown::as_pkgdown(".", override = override)
          pkgdown::clean_site(pkg)
          pkgdown::init_site(pkg)

          articles <- pkg$vignettes[pkg$vignettes$type == "rmd", ]
          topic_files <- file.path(pkg$src_path, "man", pkg$topics$file_in)
          has_examples <- vapply(
            topic_files,
            function(path) any(grepl("\\examples{", readLines(path, warn = FALSE), fixed = TRUE)),
            logical(1)
          )
          topics <- pkg$topics[has_examples, ]

          jobs <- c(
            lapply(articles$name, function(name) list(type = "article", name = name)),
            lapply(topics$name, function(name) list(type = "topic", name = name))
          )
          # Hand out the largest sources first so long jobs don't start last.
          sizes <- file.size(c(file.path(pkg$src_path, articles$file_in), topic_files[has_examples]))
          jobs <- jobs[order(sizes, decreasing = TRUE)]

          workers <- min(length(jobs), parallel::detectCores())
          if (workers > 1L) {
            cli::cli_rule("Prebuilding {length(jobs)} page{?s} with {workers} workers")
            cluster <- parallel::makeCluster(workers, outfile = "")
            results <- parallel::parLapplyLB(cluster, jobs, function(job, src_path, override) {
              start <- Sys.time()
              error <- tryCatch(
                {
                  if (job$type == "article") {
                    pkgdown::build_article(job$name, pkg = src_path, override = override)
                  } else {
                    pkgdown::build_reference(
                      pkg = src_path,
                      topics = job$name,
                      devel = FALSE,
                      override = override
                    )
                  }
                  NULL
                },
                error = conditionMessage
              )
              elapsed <- as.numeric(difftime(Sys.time(), start, units = "secs"))
              c(job, list(elapsed = elapsed, error = error))
            }, src_path = pkg$src_path, override = override, chunk.size = 1L)
            parallel::stopCluster(cluster)

            for (result in results) {
              status <- if (is.null(result$error)) "ok" else "failed; rebuilding serially"
              cli::cli_inform("{result$type} {.file {result$name}}: {round(result$elapsed)}s ({status})")
            }
          }

          pkgdown::build_site_github_pages(
            clean = FALSE,
            lazy = TRUE,
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      - name: Add and verify canonical URLs
        run: |
          config_candidates <- c(
            Sys.getenv("PKGDOWN_CONFIG", unset = ""),
            "_pkgdown.yml",
            "_pkgdown.yaml",
            "pkgdown/_pkgdown.yml",
            "pkgdown/_pkgdown.yaml"
          )
          config_candidates <- config_candidates[
            nzchar(config_candidates) & file.exists(config_candidates)
          ]
          if (length(config_candidates) == 0) {
            stop("Cannot add canonical URLs: no pkgdown configuration file found.")
          }

          site_url <- yaml::read_yaml(config_candidates[[1]])$url
          if (is.null(site_url) || !grepl("^https://", site_url)) {
            stop("Cannot add canonical URLs: pkgdown 'url' must be an absolute HTTPS URL.")
          }
          site_url <- sub("/+$", "", site_url)

          html_files <- list.files(
            "docs",
            pattern = "\\.html$",
            recursive = TRUE,
            full.names = TRUE
          )
          if (length(html_files) == 0) {
            stop("Cannot add canonical URLs: pkgdown generated no HTML files.")
          }
          indexable_html_files <- html_files[basename(html_files) != "404.html"]

          canonical_pattern <- "<link[^>]+rel\\s*=\\s*[\"']canonical[\"'][^>]*>"
          added <- 0L
          for (html_file in indexable_html_files) {
            html <- readLines(html_file, warn = FALSE, encoding = "UTF-8")
            document <- paste(html, collapse = "\n")
            if (grepl(canonical_pattern, document, ignore.case = TRUE, perl = TRUE)) {
              next
            }

            relative_path <- sub("^docs/", "", html_file)
            canonical_url <- paste0(
              site_url,
              "/",
              utils::URLencode(relative_path, reserved = FALSE)
            )
            canonical_tag <- sprintf(
              "<link rel=\"canonical\" href=\"%s\">",
              canonical_url
            )

            insertion_line <- grep("<title(?:\\s|>)", html, ignore.case = TRUE, perl = TRUE)[1]
            if (is.na(insertion_line)) {
              insertion_line <- grep("<head(?:\\s|>)", html, ignore.case = TRUE, perl = TRUE)[1]
            }
            if (is.na(insertion_line)) {
              stop("Cannot add a canonical URL to ", html_file, ": no <head> element found.")
            }

            html <- append(html, canonical_tag, after = insertion_line)
            writeLines(html, html_file, useBytes = TRUE)
            added <- added + 1L
          }

          invalid <- vapply(indexable_html_files, function(html_file) {
            document <- paste(
              readLines(html_file, warn = FALSE, encoding = "UTF-8"),
              collapse = "\n"
            )
            matches <- gregexpr(
              canonical_pattern,
              document,
              ignore.case = TRUE,
              perl = TRUE
            )[[1]]
            canonical_count <- if (matches[[1]] == -1L) 0L else length(matches)
            canonical_count != 1L
          }, logical(1))
          if (any(invalid)) {
            stop(
              "Expected exactly one canonical URL in every indexable HTML file; invalid files: ",
              paste(indexable_html_files[invalid], collapse = ", ")
            )
          }

          message(
            "Verified exactly one canonical URL in ",
            length(indexable_html_files),
            " indexable HTML files (added ",
            added,
            "); skipped ",
            length(html_files) - length(indexable_html_files),
            " 404 utility page(s)."
          )
        shell: Rscript {0}

      - name: Upload pkgdown site
        if: ${{ !inputs.no-suggests && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkgdown-site
          path: docs
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy pkgdown site
    if: ${{ !inputs.no-suggests && github.event_name != 'pull_request' }}
    needs: pkgdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to publish the site to the gh-pages branch.

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pkgdown site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: docs
