# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: When hard: true, only "hard" dependencies (Depends, Imports, LinkingTo) are installed.
# Suggests are never installed (except testthat, knitr, rmarkdown, curl). The cache is
# never used to avoid accidentally restoring a cache containing a suggested dependency.
# Hard mode only runs on pull requests, not on pushes to main.
on:
  workflow_call:
    inputs:
      hard:
        type: boolean
        default: false
        description: 'Run with hard dependencies only (no Suggests); only runs on PRs'
      extra-packages:
        type: string
        default: ''
        description: 'Additional packages to install (e.g., any::pkg1, any::pkg2)'
name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: ${{ !inputs.hard }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }

          - { os: windows-latest, r: "release" }

          - { os: ubuntu-latest, r: "devel" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ inputs.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          upload-snapshots: true
          upload-results: true
          error-on: '"note"'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false

  R-CMD-check-hard:
    name: Hard dependencies only
    if: ${{ inputs.hard && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::knitr
            any::rcmdcheck
            any::rmarkdown
            any::curl
            any::testthat
            ${{ inputs.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          upload-snapshots: true
