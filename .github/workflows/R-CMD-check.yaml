# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Hard mode installs hard package dependencies, checking tools, and Config/Needs/check
# entries. Its cache lives in a separate namespace derived from DESCRIPTION so that it
# never restores suggested dependencies from the full-dependency cache.
# Hard mode only runs on pull requests.
on:
  workflow_call:
    inputs:
      hard:
        type: boolean
        default: false
        description: 'Run with hard dependencies only (no Suggests); only runs on PRs'
name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: ${{ !inputs.hard }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macOS-latest, r: "release" }

          - { os: windows-latest, r: "release" }

          - { os: ubuntu-latest, r: "devel" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # testthat defaults to 2 parallel workers; GitHub-hosted runners have 3-4 vCPUs.
      TESTTHAT_CPUS: 4

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          upload-results: true
          error-on: '"note"'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false

  R-CMD-check-hard:
    name: Hard dependencies only
    if: ${{ inputs.hard && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # testthat defaults to 2 parallel workers; GitHub-hosted runners have 3-4 vCPUs.
      TESTTHAT_CPUS: 4

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          pandoc-version: "latest"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          dependencies: '"hard"'
          # Isolate hard-only caches and invalidate them when DESCRIPTION changes.
          cache-version: check-hard-deps-1-${{ hashFiles('DESCRIPTION') }}
          extra-packages: |
            any::knitr
            any::rcmdcheck
            any::rmarkdown
            any::curl
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
