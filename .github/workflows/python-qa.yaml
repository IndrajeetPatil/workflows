name: QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: |
          uv python install --color=always
          uv sync --all-extras --dev --color=always

      - name: Build the package
        run: uv build --color=always

      - name: Run QA checks
        run: make qa

      - name: Compute Coverage
        run: |
          uv run coverage run -m pytest tests/ --color=yes
          uv run coverage report --fail-under=100
          uv run coverage html
