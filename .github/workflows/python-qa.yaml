name: QA

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: |
          uv python install --color=always
          uv sync --all-extras --dev --color=always

      - name: Build the package
        run: uv build --color=always

      - name: Run QA checks
        run: make qa

      - name: Compute Coverage
        run: |
          uv run coverage run -m pytest tests/ --color=yes
          uv run coverage report --fail-under=100
          uv run coverage html

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Check README examples
        run: uv run quarto render README.qmd
