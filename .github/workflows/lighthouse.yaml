name: lighthouse

on:
  workflow_call:
    inputs:
      command:
        description: "Command to execute Lighthouse CI audits."
        type: string
        default: "vp run lighthouse"
      reports-path:
        description: "Path to the Lighthouse CI reports directory to upload as an artifact."
        type: string
        default: ".lighthouseci/"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: "1"

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+ and dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache-toolchain: true
          cache: true
          run-install: |
            args: [--frozen-lockfile, --, --loglevel=warn]

      - name: Read Pyodide version
        if: hashFiles('wheels/requirements.txt') != ''
        id: versions
        run: echo "pyodide=$(node -p 'require("pyodide/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore Pyodide wheels
        if: hashFiles('wheels/requirements.txt') != ''
        id: wheels-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/wheels
          key: wheels-${{ runner.os }}-pyodide-${{ steps.versions.outputs.pyodide }}-${{ hashFiles('wheels/requirements.txt', 'scripts/build-wheels.sh') }}

      - name: Install uv
        if: hashFiles('wheels/requirements.txt') != '' && steps.wheels-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            wheels/requirements.txt
            scripts/build-wheels.sh

      - name: Build Pyodide wheels
        if: hashFiles('wheels/requirements.txt') != '' && steps.wheels-cache.outputs.cache-hit != 'true'
        run: vp run wheels

      - name: Run Lighthouse
        env:
          AUDIT_COMMAND: ${{ inputs.command }}
        run: $AUDIT_COMMAND

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: ${{ inputs.reports-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
