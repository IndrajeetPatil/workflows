# No official GitHub Action exists for CRAN submission; uses devtools::submit_cran()
on:
  workflow_call:
    inputs:
      extra-packages:
        type: string
        default: ''
        description: 'Additional packages to install (e.g., any::pkg1, any::pkg2)'

name: submit-cran

permissions:
  contents: read

jobs:
  submit-cran:
    name: Build and submit to CRAN
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release-tag: ${{ steps.meta.outputs.tag }}
      release-title: ${{ steps.meta.outputs.title }}
      release-target: ${{ steps.source.outputs.sha }}
      release-pr: ${{ steps.source.outputs.pr-number }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1

      - name: Resolve package metadata
        id: meta
        run: |
          meta <- read.dcf("DESCRIPTION", fields = c("Package", "Version"))[1L, ]
          pkg <- unname(meta[["Package"]])
          ver <- unname(meta[["Version"]])
          out <- Sys.getenv("GITHUB_OUTPUT")
          cat("package=", pkg, "\n", sep = "", file = out, append = TRUE)
          cat("version=", ver, "\n", sep = "", file = out, append = TRUE)
          cat("tag=v",    ver, "\n", sep = "", file = out, append = TRUE)
          cat("title=",   pkg, " ", ver, "\n", sep = "", file = out, append = TRUE)
        shell: Rscript {0}

      - name: Resolve submitted release commit
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          submitted_sha="$GITHUB_SHA"
          pr_number=""

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            pulls_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=${DEFAULT_BRANCH}&per_page=100&sort=updated&direction=desc"
            response="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "User-Agent: IndrajeetPatil-workflows" \
              "$pulls_url")"
            match="$(jq --arg title "CRAN Release ${PACKAGE_VERSION}" '
              [
                .[]
                | select(.merged_at != null and (.title | contains($title)))
              ]
              | sort_by(.merged_at)
              | reverse
              | .[0]
            ' <<<"$response")"
            submitted_sha="$(jq -r '.head.sha // empty' <<<"$match")"
            pr_number="$(jq -r '.number // empty' <<<"$match")"

            if [[ ! "$submitted_sha" =~ ^[0-9a-f]{40}$ || -z "$pr_number" ]]; then
              echo "::error::No merged CRAN Release ${PACKAGE_VERSION} pull request was found."
              exit 1
            fi

            echo "::notice::Releasing submitted tree from pull request #${pr_number} at ${submitted_sha}."
          fi

          echo "sha=${submitted_sha}" >> "$GITHUB_OUTPUT"
          echo "pr-number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Check out submitted release commit
        if: >-
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify submitted package metadata
        env:
          EXPECTED_PACKAGE: ${{ steps.meta.outputs.package }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          meta <- read.dcf("DESCRIPTION", fields = c("Package", "Version"))[1L, ]
          stopifnot(
            identical(unname(meta[["Package"]]), Sys.getenv("EXPECTED_PACKAGE")),
            identical(unname(meta[["Version"]]), Sys.getenv("EXPECTED_VERSION"))
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          extra-packages: |
            any::devtools
            any::pkgbuild
            ${{ inputs.extra-packages }}

      - name: Build source tarball
        id: build
        run: |
          tarball <- pkgbuild::build(".", dest_path = ".", binary = FALSE)
          out <- Sys.getenv("GITHUB_OUTPUT")
          cat("tarball=", tarball, "\n", sep = "", file = out, append = TRUE)
        shell: Rscript {0}

      - name: Upload source tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-tarball
          path: ${{ steps.build.outputs.tarball }}
          retention-days: 1

      - name: Submit to CRAN
        if: >-
          github.ref_type == 'branch' &&
          github.ref_name != github.event.repository.default_branch
        run: |
          assignInNamespace("yesno", function(...) FALSE, "devtools")
          devtools::submit_cran()
        shell: Rscript {0}

  # The release branch is submitted while its PR remains open. Publish only
  # when this workflow is rerun from the default branch after that PR is merged.
  release:
    name: Create GitHub Release
    needs: submit-cran
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create the release and tag.

    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.submit-cran.outputs.release-target }}
          persist-credentials: false

      - name: Download source tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-tarball
          path: release-assets

      - name: Extract release notes from NEWS.md
        env:
          RELEASE_TITLE: ${{ needs.submit-cran.outputs.release-title }}
        run: |
          awk -v heading="# ${RELEASE_TITLE}" '
            $0 == heading { capture = 1 }
            capture && /^# / && $0 != heading { exit }
            capture { print }
          ' NEWS.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::NEWS.md has no section for ${RELEASE_TITLE}."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.submit-cran.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.submit-cran.outputs.release-title }}
          TARGET_COMMIT: ${{ needs.submit-cran.outputs.release-target }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*.tar.gz
          --title "$RELEASE_TITLE"
          --notes-file release-notes.md
          --target "$TARGET_COMMIT"
