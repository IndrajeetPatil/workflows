on:
  workflow_call:
    inputs:
      extra-render-args:
        type: string
        default: ''
        description: 'Extra arguments to pass to quarto render'

name: Build and Deploy Presentation

permissions:
  contents: read

jobs:
  build-presentation:
    name: Build presentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: release

      - name: Setup Pandoc (latest)
        uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          pandoc-version: latest

      - name: Report tool versions
        run: |
          quarto --version
          pandoc --version | head -n 1

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Render slides
        run: |
          PANDOC_DIR="$(dirname "$(command -v pandoc)")"
          QUARTO_PANDOC="$PANDOC_DIR" uv run --no-project quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy presentation
    if: github.event_name != 'pull_request'
    needs: build-presentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Required to configure and deploy GitHub Pages.
      id-token: write # Required for Pages OIDC authentication.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restrict to IndrajeetPatil repositories
        if: github.repository_owner != 'IndrajeetPatil'
        run: |
          echo "::error::This workflow is private and only available to repositories under IndrajeetPatil."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
